/* ---------- Sunucu hesabı (tek doğru kaynak) ----------

var dataVer=0,wsCache={},wsBusy={},wsFailAt=0;
function wsKey(){return dstr(week)}
function wsRequest(){
  var k=wsKey();if(!sb||wsBusy[k])return;
  if(Date.now()-wsFailAt<8000)return;
  var v=dataVer,wk=week;wsBusy[k]=1;
  Promise.resolve(sb.rpc('week_state',{p_week:k})).then(function(r){
    delete wsBusy[k];
    var js=r&&!r.error&&r.data;
    if(!js||!js.ok||!js.days||js.days.length!==7||!js.pct){wsFailAt=Date.now();return}
    wsCache[k]={v:v,js:js};
    if(wk===week||v!==dataVer)scheduleRender();
  }).catch(function(){delete wsBusy[k];wsFailAt=Date.now()});
}
function fromServer(js){
  var pct={},ok=true;
  staff.forEach(function(s){var a=js.pct[s.id];if(!a||a.length!==7)ok=false;pct[s.id]=a});
  if(!ok)return null;
  var res=[];
  for(var i=0;i<7;i++){
    var d=js.days[i],ds=dstr(week+i);if(d.ds!==ds)return null;
    var get=function(sid){return leaves.get(sid+'|'+ds)};
    var fixed=[],oks=[],wait=[],okIds={};
    for(var a=0;a<d.fixed.length;a++){var f=get(d.fixed[a].s);if(!f||f.type!==d.fixed[a].t)return null;fixed.push(f)}
    for(var b=0;b<d.ok.length;b++){var o=get(d.ok[b]);if(!o)return null;oks.push(o);okIds[o.staff_id]=1}
    for(var c=0;c<d.wait.length;c++){var w=get(d.wait[c]);if(!w)return null;wait.push(w)}
    res.push({ds:ds,fixed:fixed,ok:oks,okIds:okIds,wait:wait,quota:d.quota,locked:!!d.locked,used:d.used});
  }
  return {pct:pct,res:res};
}
function compute(){
  var ws=wsCache[wsKey()];
  if(ws&&ws.v===dataVer){var sv=fromServer(ws.js);if(sv){lastRes=sv.res;return sv}}
  if(ready)setTimeout(wsRequest,0);
  return computeLocal();
}
function computeLocal(){
  var uses={};staff.forEach(function(s){uses[s.id]=[[],[],[],[],[],[],[]]});
  leaves.forEach(function(l){if((l.type!=='I'&&l.type!=='M')||!uses[l.staff_id])return;var n=dnum(l.day);uses[l.staff_id][wdOf(n)].push(weekNo(n))});
  var wk=weekNo(week),pct={};staff.forEach(function(s){pct[s.id]=[]});
  for(var d=0;d<7;d++){
    var cnt={},hs={},m=0;
    staff.forEach(function(s){var h=uses[s.id][d].filter(function(w){return w<wk}).sort(function(a,b){return b-a});cnt[s.id]=h.length;hs[s.id]=h;if(h.length>m&&!isTop(s))m=h.length});
    var step=100/(m+1);
    staff.forEach(function(s){
      var ks=[];staff.forEach(function(q){if(!isTop(q)&&cnt[q.id]===cnt[s.id]&&!ks.some(function(k){return cmp(k,hs[q.id])===0}))ks.push(hs[q.id])});
      ks.sort(cmp);var r=0;for(var t=0;t<ks.length;t++)if(cmp(ks[t],hs[s.id])===0){r=t;break}
      pct[s.id][d]=Math.round(100*(1-cnt[s.id]/(m+1))-(ks.length>1?r/ks.length*step*.5:0));
    });
  }
  var by=new Map();leaves.forEach(function(l){if(!staffById[l.staff_id])return;var a=by.get(l.day);if(a)a.push(l);else by.set(l.day,[l])});
  var nm=function(l){return staffById[l.staff_id].name};
  var res=[];
  for(var i=0;i<7;i++){
    (function(i){
      var ds=dstr(week+i),rows=by.get(ds)||[],fixed=[],req=[];
      rows.forEach(function(l){(l.type==='I'?req:fixed).push(l)});
      fixed.sort(function(a,b){return a.type<b.type?-1:a.type>b.type?1:nm(a).localeCompare(nm(b),'tr')});
      req.sort(function(a,b){return ((b.swap?1:0)-(a.swap?1:0))||(pct[b.staff_id][i]-pct[a.staff_id][i])||(ts(a.created_at)-ts(b.created_at))||nm(a).localeCompare(nm(b),'tr')});
      var rule=rules.get(ds)||{},q=(rule.quota!=null)?rule.quota:DEFQ[i];
      var fx=req.filter(function(l){return staffById[l.staff_id].exempt}),rq=req.filter(function(l){return !staffById[l.staff_id].exempt});
      var nsw=rq.filter(function(l){return l.swap}).length,slots=(q==null)?rq.length:Math.max(0,q-fixed.length,nsw);
      var ok=fx.concat(rq.slice(0,slots)),okIds={};ok.forEach(function(l){okIds[l.staff_id]=1});
      res.push({ds:ds,fixed:fixed,ok:ok,okIds:okIds,wait:rq.slice(slots),quota:q,locked:!!rule.locked,used:fixed.length+ok.length-fx.length});
    })(i);
  }
  lastRes=res;
  return {pct:pct,res:res};
}

function pb64(x){x=String(x).replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';var b=atob(x),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}

function weekHead(){
  var tn=todayNum(),isCur=weekMon(tn)===week;
  return '<div class="wk"><button class="btn" data-a="prev" aria-label="Önceki hafta"'+(week<=FIRST_WEEK?' disabled':'')+'>‹</button><div class="wt"><b>'+dLabelF(week)+' – '+dLabelF(week+6)+'</b><small>'+(isCur?'Bu Hafta · <a href="#" data-a="next">Gelecek Haftaya Geç</a>':week>weekMon(tn)?(week>weekMon(tn)+7?'İleri Hafta (Tahmin) · ':'Gelecek Hafta · ')+'<a href="#" data-a="today">Bu Haftaya Dön</a>':'<a href="#" data-a="today">Bu Haftaya Dön</a>')+'</small></div><button class="btn" data-a="next" aria-label="Sonraki hafta"'+(week>=maxWeek()?' disabled':'')+'>›</button></div>';
}

function dayStrip(c){
  var tn=todayNum(),h='<div class="strip">';
  for(var i=0;i<7;i++){
    var r=c.res[i],dn=week+i,used=r.used,own=me?leaves.get(me.id+'|'+r.ds):null;
    var dot=own?'<i class="'+(own.type!=='I'?'fix':r.okIds[me.id]?'':'wait')+'"></i>':'';
    var cnt=used+'/'+r.quota;
    h+='<button class="dp'+(i===selDay?' on':'')+(dn===tn?' td':'')+(dn<tn?' past':'')+'" data-a="selday" data-i="'+i+'">'+dot+'<span>'+DS[i]+'</span><b>'+new Date(dn*864e5).getUTCDate()+'</b><em class="'+(r.quota!=null&&used>=r.quota?'full':'')+'">'+cnt+(r.locked?'🔒':'')+'</em></button>';
  }
  return h+'</div>';
}

function row(l,st,i,pct){
  var s=staffById[l.staff_id],mine=me&&me.id===l.staff_id;
  var tag=l.type==='M'?'<span class="tag fix">⭐ Mazeretli</span>':l.type==='Y'?'<span class="tag fix">Yıllık</span>':l.type==='R'?'<span class="tag fix">Rapor</span>':st==='ok'?'<span class="tag ok">✓ Onaylı</span>':'<span class="tag wait">⏳ Sırada</span>';
  var pc=l.type==='I'?pcChip(pct[l.staff_id][i]):'';
  var ctl='';
  if(admin){
    ctl='<select class="rs" data-a="setrow" data-day="'+l.day+'" data-staff="'+l.staff_id+'">'+['I','M','Y','R'].map(function(t){return '<option value="'+t+'"'+(t===l.type?' selected':'')+'>'+TN[t]+'</option>'}).join('')+'<option value="">Kaldır</option></select>';
  }
  if(st==='ok'&&l.type==='I'&&me&&!mine&&!admin&&swapAllowed(l.day)&&myTradables().length)ctl+='<button class="btn s swb" data-a="swapopen" data-staff="'+l.staff_id+'" data-day="'+l.day+'" title="Bu günle takas teklif et">⇄</button>';
  return '<div class="p'+(mine?' me':'')+'"><span class="nm">'+esc(s.name)+'</span>'+tag+(l.swap?'<span class="tag fix">Takas</span>':'')+pc+ctl+'</div>';
}

var swList={incoming:[],outgoing:[]},swSig='';
function swapAllowed(ds){var n=dnum(ds),tn=todayNum(),rl=rules.get(ds);return n>=tn&&n<weekMon(tn)+14&&!(rl&&rl.locked)}
function okOn(sid,ds){
  var n=dnum(ds),wm=dstr(weekMon(n)),c=wsCache[wm];
  if(c&&c.js&&c.js.days){var d=c.js.days[n-weekMon(n)];if(d)return d.ok.indexOf(sid)>=0}
  if(lastRes){for(var i=0;i<lastRes.length;i++)if(lastRes[i].ds===ds)return !!lastRes[i].okIds[sid]}
  return null}
function myTradables(){
  var out=[];if(!me)return out;
  leaves.forEach(function(l){if(l.staff_id===me.id&&l.type==='I'&&swapAllowed(l.day)&&okOn(me.id,l.day)!==false)out.push(l.day)});
  out.sort();return out}
function dayName(ds){var n=dnum(ds);return DAYS[wdOf(n)]+' '+dLabelF(n)}
async function loadSwaps(){
  if(!me){swList={incoming:[],outgoing:[]};swSig='';return}
  if(!sb)return;
  var r=await rpc('staff_swap_list',{p_staff:me.id,p_pin:me.pin},true);
  if(r&&r.ok){var sg=JSON.stringify([r.incoming,r.outgoing]);if(sg!==swSig){swSig=sg;swList={incoming:r.incoming||[],outgoing:r.outgoing||[]};scheduleRender()}}}
function swapCard(){
  if(!me||(!swList.incoming.length&&!swList.outgoing.length))return '';
  var h='<div class="card"><div class="sub"><span class="ic i4">⇄</span>Takas</div>';
  swList.incoming.forEach(function(t){
    h+='<div class="p sw"><div style="flex:1"><b>'+esc(t.who)+'</b> <span class="s">'+esc(dayName(t.give))+' gününüzü almak istiyor, karşılığında <b>'+esc(dayName(t.take))+'</b> gününü veriyor.</span></div><button class="btn s grn" data-a="swapacc" data-id="'+t.id+'">Kabul Et</button><button class="btn s out" data-a="swaprej" data-id="'+t.id+'">Reddet</button></div>'});
  swList.outgoing.forEach(function(t){
    h+='<div class="p sw"><div style="flex:1" class="s"><b>'+esc(t.who)+'</b> kişisine teklif: <b>'+esc(dayName(t.give))+'</b> ⇄ <b>'+esc(dayName(t.take))+'</b> · Yanıt bekleniyor</div><button class="btn s out" data-a="swapcan" data-id="'+t.id+'">İptal</button></div>'});
  return h+'</div>'}
function swapSheet(otherId,otherDay){
  var days=myTradables(),o=$('swov');
  if(!o){o=document.createElement('div');o.id='swov';document.body.appendChild(o)}
  var nm=staffById[otherId]?staffById[otherId].name:'?';
  o.innerHTML='<div class="swbg" data-a="swapclose"></div><div class="swsh"><div class="sub" style="margin-top:0">Takas Teklifi</div><div class="s mute" style="margin-bottom:10px"><b>'+esc(nm)+'</b> kişisinin <b>'+esc(dayName(otherDay))+'</b> gününü almak için hangi gününüzü verirsiniz?</div>'+
    (days.length?days.map(function(ds){return '<button class="btn big" data-a="swapgo" data-staff="'+otherId+'" data-other="'+otherDay+'" data-mine="'+ds+'">'+esc(dayName(ds))+'</button>'}).join(''):'<div class="empty">Takas edebileceğiniz onaylı bir gününüz yok</div>')+
    '<button class="btn out big" data-a="swapclose" style="margin-top:0">Vazgeç</button></div>';

function swapClose(){var o=$('swov');if(o){o.style.display='none';o.innerHTML=''}}

var OWNER_ID=11;
var TOPNAMES=['Nilgün Gül'];
function isTop(st){return TOPNAMES.indexOf(st.name)>=0}
var MAXW=2,WEEKCAP=34,DEFQ=[5,4,5,5,5,5,5];
function weekQuotaSum(ws,ovDay,ovQ){var t=0;for(var i=0;i<7;i++){var ds=dstr(ws+i),rl=rules.get(ds)||{},q=(rl.quota!=null)?rl.quota:DEFQ[i];if(ds===ovDay)q=ovQ;t+=q}return t}
function weekNormals(){var n=0;for(var i=0;i<7;i++){var ds=dstr(week+i);leaves.forEach(function(l){if(l.day===ds&&l.type==='I'&&staffById[l.staff_id]&&!staffById[l.staff_id].exempt)n++})}return n}
function myWeekCount(){var n=0;for(var i=0;i<7;i++){var l=leaves.get(me.id+'|'+dstr(week+i));if(l&&(l.type==='I'||l.type==='M'))n++}return n}
function meAdm(){return !!(me&&admin&&admin.viaStaff&&String(admin.pin).split(':')[0]===String(me.id))}
function dayCard(i,pct,r){
  var dn=week+i,tn=todayNum(),past=dn<tn,isT=dn===tn,used=r.used;
  var h='<div class="card day">';
  h+='<div class="dh"><b>'+DAYS[i]+'</b> <span class="mute">'+dLabel(dn)+(isT?' · Bugün':'')+'</span><div class="cap'+(r.quota!=null&&used>=r.quota?' full':'')+'">'+(r.locked?'🔒 Kilitli · ':'')+('Kontenjan '+r.quota+' · dolu '+used+(r.wait.length?' · '+r.wait.length+' sırada':''))+'</div></div>';
  if(me){
    var own=leaves.get(me.id+'|'+r.ds);
    if(own&&own.type!=='I'){/* yönetici belirlemiş, listede görünüyor */}
    else if(past)h+='<div class="note">Geçmiş gün, değiştirilemez</div>';
    else if(r.locked&&!meAdm()&&!(staffById[me.id]&&staffById[me.id].exempt))h+='';
    else if(own)h+='<button class="btn out big" data-a="toggle" data-day="'+r.ds+'" data-on="0">Vazgeç</button>';
    else if(!meAdm()&&myWeekCount()>=MAXW)h+='<div class="note">Bu hafta en fazla '+MAXW+' gün izin seçebilirsiniz. Başka bir gün için önce birinden vazgeçin.</div>';
    else if(!meAdm()&&weekNormals()>=WEEKCAP)h+='<div class="note">Bu haftanın '+WEEKCAP+' izin hakkı doldu.</div>';
    else h+='<button class="btn pri big" data-a="toggle" data-day="'+r.ds+'" data-on="1">İzin seç (önceliğiniz '+pct[me.id][i]+')</button>';
  }else if(!past)h+='<div class="note">İzin seçmek için yukarıdan adınızla giriş yapın</div>';
  if(!r.fixed.length&&!r.ok.length&&!r.wait.length)h+='<div class="empty">Henüz kimse seçmedi</div>';
  r.fixed.forEach(function(l){h+=row(l,'fix',i,pct)});
  r.ok.forEach(function(l){h+=row(l,'ok',i,pct)});
  if(r.wait.length){h+='<div class="sep">Kontenjan doldu, sırada bekleyenler</div>';r.wait.forEach(function(l){h+=row(l,'wait',i,pct)})}
  if(admin){
    h+='<div class="adm"><div class="qc"><span class="s mute">Kontenjan</span><button class="btn s" data-a="quota" data-day="'+r.ds+'" data-d="-1">−</button><b>'+r.quota+'</b><button class="btn s" data-a="quota" data-day="'+r.ds+'" data-d="1">+</button><button class="btn s" data-a="assign" title="Bu haftanın tüm onay bekleyenlerini öncelik sırasıyla boş günlere ata"'+(weekWaitCount()?'':' disabled')+'>Haftayı Ata'+(weekWaitCount()?' ('+weekWaitCount()+')':'')+'</button></div><button class="btn s" data-a="lock" data-day="'+r.ds+'" data-v="'+(r.locked?0:1)+'">'+(r.locked?'Kilidi Aç':'🔒 Kilitle')+'</button></div>';
    var avail=staff.filter(function(s){return !leaves.has(s.id+'|'+r.ds)});
    h+='<details style="margin-top:8px"><summary class="addsum">＋ Kişi Ekle</summary><div class="mute s" style="margin-top:6px">Mazeretli, yıllık, rapor veya normal izin olarak ekleyin.</div><div class="add"><select id="ap-'+i+'"><option value="">Kişi seçin…</option>'+avail.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join('')+'</select><select id="at-'+i+'"><option value="M">⭐ Mazeretli</option><option value="Y">Yıllık</option><option value="R">Rapor</option><option value="I">Normal</option></select><button class="btn s grn" data-a="addrow" data-day="'+r.ds+'" data-i="'+i+'">Ekle</button></div></details>';
  }
  return h+'</div>';
}

function feedHtml(){
  if(!logs.length)return '<div class="empty">Henüz hareket yok</div>';
  return logs.slice(0,30).map(function(g){
    var dt='';if(g.day){var n=dnum(g.day);dt=' · '+DAYS[wdOf(n)]+' '+dLabel(n)}
    return '<div class="lg"><span class="tm">'+esc(fmtAt(g.at))+'</span><span><b>'+esc(g.who)+'</b> '+esc(g.action)+(g.detail?' · '+esc(g.detail):'')+esc(dt)+'</span></div>';
  }).join('');
}

function logTab(){
  if(logsAll===null)return '<div class="card empty">Hareketler yükleniyor…</div>';
  var q=logQ.trim().toLocaleLowerCase('tr'),list=logsAll;
  if(q)list=list.filter(function(g){return ((g.who||'')+' '+(g.action||'')+' '+(g.detail||'')).toLocaleLowerCase('tr').indexOf(q)>=0});
  var h='<div class="card"><div class="tt"><b>Tüm hareketler</b><span class="mute s">Sistem kurulduğundan bu yana '+logsAll.length+' kayıt'+(q?' · '+list.length+' sonuç':'')+'</span></div>';
  h+='<div class="row" style="margin:8px 0"><input id="logq" type="search" placeholder="Kişi ya da işlem ara…" value="'+esc(logQ)+'" style="flex:1"><button class="btn s" data-a="logref">Yenile</button></div>';
  if(!list.length)h+='<div class="empty">Kayıt yok</div>';
  else h+=list.slice(0,logShow).map(function(g){
    var dt='';if(g.day){var n=dnum(g.day);dt=' · '+DAYS[wdOf(n)]+' '+dLabel(n)}
    return '<div class="lg"><span class="tm">'+esc(fmtAt(g.at))+'</span><span><b>'+esc(g.who)+'</b> '+esc(g.action)+(g.detail?' · '+esc(g.detail):'')+esc(dt)+'</span></div>';
  }).join('');
  if(list.length>logShow)h+='<button class="btn big" data-a="logmore" style="margin-top:10px">Daha fazla göster ('+(list.length-logShow)+')</button>';
  return h+'</div>';
}
async function loadAllLogs(){
  if(!admin||!sb)return;
  var all=[],from=0,step=1000;
  for(var k=0;k<200;k++){
    var r=await sb.from('log').select('id,at,who,action,day,detail').order('id',{ascending:false}).range(from,from+step-1);
    if(r.error){toast('Hareketler yüklenemedi',1);break}
    all=all.concat(r.data||[]);if(!r.data||r.data.length<step)break;from+=step;
  }
  logsAll=all.filter(function(g){return !((g.who||'').indexOf('Eyüp Bulut')>=0&&(g.detail||'').indexOf('Nilgün Gül')>=0)});if(tab==='hrk')scheduleRender();
}

function weekLists(){
  var c=compute(),h='',none=[],wait=[];
  staff.forEach(function(s){var any=false;for(var i=0;i<7;i++)if(leaves.get(s.id+'|'+dstr(week+i)))any=true;if(!any)none.push(s)});
  for(var d=0;d<7;d++)c.res[d].wait.forEach(function(l){wait.push({d:d,l:l})});
  if(wait.length){
    h+='<div class="card"><div class="sub"><span class="ic i4">⏳</span>Onay Bekleyenler <span class="mute s">· '+wait.length+' Kişi</span></div><button class="btn pri" data-a="assign" style="margin-bottom:8px">Hepsini Boş Günlere Ata</button>';
    wait.forEach(function(w){var sid=w.l.staff_id,sn=staffById[sid];h+='<div class="p"><span class="nm">'+esc(sn?sn.name:'?')+'</span><span class="mute s">'+DAYS[w.d]+' · Öncelik '+c.pct[sid][w.d]+'</span></div>'});
    h+='</div>';
  }
  if(none.length){
    h+='<div class="card"><div class="sub"><span class="ic i5">👤</span>Bu Hafta İzin Seçmeyenler <span class="mute s">· '+none.length+' Kişi</span></div><div class="chips">'+none.map(function(s){return '<span class="chip">'+esc(s.name)+'</span>'}).join('')+'</div></div>';
  }
  return h;
}

function excCard(){

function planAssign(){
  var c=compute(),tn=todayNum(),free=[];
  for(var j=0;j<7;j++){var rj=c.res[j];free[j]=(week+j<tn||rj.locked)?0:Math.max(0,rj.quota-rj.used)}
  var waiters=[];
  for(var d=0;d<7;d++)c.res[d].wait.forEach(function(l){waiters.push({l:l,d:d})});
  waiters.sort(function(a,b){return (c.pct[b.l.staff_id][b.d]-c.pct[a.l.staff_id][a.d])||(ts(a.l.created_at)-ts(b.l.created_at))});
  var moves=[],stuck=[];
  waiters.forEach(function(w){
    var sid=w.l.staff_id,best=-1;
    for(var j=0;j<7;j++){
      if(j===w.d||free[j]<=0||leaves.get(sid+'|'+dstr(week+j)))continue;
      if(best<0||c.pct[sid][j]>c.pct[sid][best])best=j;
    }
    if(best<0)stuck.push({sid:sid,from:w.d});else{free[best]--;moves.push({sid:sid,from:dstr(week+w.d),fromI:w.d,to:dstr(week+best),toI:best})}
  });
  return {moves:moves,stuck:stuck,total:waiters.length};
}

      var ap=($('apin').value||'').trim();if(!ap){toast('Yönetici PIN girin',1);break}
      r=await rpc('admin_login',{p_pin:ap});
      if(r&&r.ok){admin={pin:ap};saveAdm();renderAll();toast('Yönetici modu açıldı');loadStatus()}
      break}
    case 'adm-out':admin=null;saveAdm();if(tab==='yon')tab='gun';renderAll();return;
    case 'assign':{
      var pl=planAssign();
      if(!pl.moves.length){toast(pl.stuck.length?'Boş gün bulunamadı, bekleyenler yerinde kaldı':'Bu hafta onay bekleyen yok',1);break}
      var msg=pl.moves.map(function(m){return staffById[m.sid].name+': '+DAYS[m.fromI]+' → '+DAYS[m.toI]}).join('\n');
      if(pl.stuck.length)msg+='\n\nBoş gün bulunamayan: '+pl.stuck.map(function(x){return staffById[x.sid].name+' ('+DAYS[x.from]+')'}).join(', ');
      if(!confirm(dLabel(week)+' – '+dLabel(week+6)+' haftasında bekleyenler boş günlere atansın mı?\n\n'+msg))break;
      var done=0;
      for(var q=0;q<pl.moves.length;q++){
        var mv=pl.moves[q];
        var r1=await rpc('admin_set_leave',{p_pin:admin.pin,p_staff:mv.sid,p_day:mv.to,p_type:'I'});
        if(!(r1&&r1.ok))break;
        var r2=await rpc('admin_set_leave',{p_pin:admin.pin,p_staff:mv.sid,p_day:mv.from,p_type:null});
        setLocal(mv.sid,mv.to,'I');if(r2&&r2.ok)setLocal(mv.sid,mv.from,null);done++;
      }
      toast(done+' kişi boş güne atandı');
      break}
    case 'quota':case 'quota-inf':{
      var rule=rules.get(d.day)||{},cur=rule.quota,nq=null;
      if(a==='quota'){
        var base=(cur!=null)?cur:DEFQ[wdOf(dnum(d.day))];
        nq=Math.max(0,base+(+d.d));
        if(weekQuotaSum(weekMon(dnum(d.day)),d.day,nq)>WEEKCAP){toast('Haftalık toplam kontenjan en fazla '+WEEKCAP+' olabilir',1);break}
      }
      r=await rpc('admin_set_quota',{p_pin:admin.pin,p_day:d.day,p_quota:nq});
      if(r&&r.ok)setRule(d.day,{quota:nq});
      break}
    case 'lock':{
      var lv=d.v==='1';
      r=await rpc('admin_set_lock',{p_pin:admin.pin,p_days:[d.day],p_locked:lv});
      if(r&&r.ok)setRule(d.day,{locked:lv});
      break}
    case 'lockweek':{
      var lw=d.v==='1',days=[];for(var i=0;i<7;i++)days.push(dstr(week+i));
      r=await rpc('admin_set_lock',{p_pin:admin.pin,p_days:days,p_locked:lw});
      if(r&&r.ok){days.forEach(function(x){setRule(x,{locked:lw})});toast(lw?'Hafta kilitlendi':'Kilit açıldı')}
      break}
    case 'setrow':{
      var tp=d.value||null,sid=+d.staff;
      r=await rpc('admin_set_leave',{p_pin:admin.pin,p_staff:sid,p_day:d.day,p_type:tp});
      if(r&&r.ok)setLocal(sid,d.day,tp);
      break}
    case 'addrow':{
      var who=+$('ap-'+d.i).value,tp2=$('at-'+d.i).value;
      if(!who){toast('Önce kişiyi seçin',1);break}
      r=await rpc('admin_set_leave',{p_pin:admin.pin,p_staff:who,p_day:d.day,p_type:tp2});
      if(r&&r.ok)setLocal(who,d.day,tp2);
      break}
    case 'addstaff':{
      var lines=($('newstaff').value||'').split(/\n/).map(function(s){return s.trim()}).filter(Boolean),out=[];
      if(!lines.length){toast('Ad yazın',1);break}
      for(var k=0;k<lines.length;k++){
        var parts=lines[k].split(/[;,\t]/),nm=parts[0].trim(),pp=(parts[1]||'').trim();
        x=await rpc('admin_add_staff',{p_pin:admin.pin,p_name:nm,p_staff_pin:pp||null},true);
        out.push(x&&x.ok?x.name+': '+x.pin:nm+': HATA - '+((x&&x.error)||'bağlantı'));
      }
      await loadStaff();await loadStatus(true);renderAuth();renderMain();
      var po=$('pinout');if(po)po.textContent=out.join('\n');
      return}
    case 'setpin':{
      var a1=($('np1').value||'').trim(),a2=($('np2').value||'').trim();
      if(!/^[0-9]{4,8}$/.test(a1)){toast('PIN 4-8 rakam olmalı',1);break}
      if(a1!==a2){toast('İki PIN aynı değil',1);break}
      r=await rpc('staff_change_pin',{p_staff:me.id,p_old:me.pin,p_new:a1});
      if(r&&r.ok){me.pin=a1;me.mustChange=false;if(admin&&admin.viaStaff)admin.pin=me.id+':'+a1;saveMe();renderAll();toast('PIN kaydedildi')}
      break}
    case 'setpinfor':{
      var s1=staffById[d.id];if(!s1)break;
      if(!confirm(s1.name+' için PIN 0000 olarak sıfırlansın mı? Kişi bir sonraki girişte kendi PIN\'ini belirler.'))break;
      r=await rpc('admin_reset_pin',{p_pin:admin.pin,p_staff:+d.id,p_new:'0000'});
      if(r&&r.ok){await loadStatus();toast(r.name+' PIN\'i 0000 yapıldı')}
      break}
    case 'excsend':{var tx=$('exctxt'),dy=$('excday');excDraft=tx?tx.value:excDraft;
      if(!excDraft.trim()){toast('Mazeretinizi yazın',1);break}
      r=await rpc('staff_add_excuse',{p_staff:me.id,p_pin:me.pin,p_day:(dy&&dy.value)||null,p_txt:excDraft});
      if(r&&r.ok){excDraft='';excDay='';renderMain();toast('Mazeretiniz yöneticilere iletildi');pushExcuse()}
      break}
    case 'excdel':{if(!confirm('Bu mazeret silinsin mi?'))break;r=await rpc('admin_excuse_delete',{p_pin:admin.pin,p_id:+d.id});if(r&&r.ok){exList=exList.filter(function(e){return e.id!==+d.id});renderMain();toast('Mazeret silindi')}break}
    case 'excdone':{r=await rpc('admin_excuse_done',{p_pin:admin.pin,p_id:+d.id,p_done:d.v==='1'});if(r&&r.ok)loadStatus();break}
    case 'pushtog':await pushToggle();break;
    case 'exempt':{
      var s5=staffById[d.id],on5=d.v==='1';if(!s5)break;
      if(!confirm(on5?s5.name+' kontenjana takılmadan izin seçebilsin mi?':s5.name+' için bu yetki kapatılsın mı?'))break;
      r=await rpc('admin_set_exempt',{p_pin:admin.pin,p_staff:+d.id,p_on:on5});
      if(r&&r.ok){await loadStaff();toast(on5?'★ Kontenjan dışı açıldı':'Kontenjan dışı kapatıldı')}
      break}
    case 'logref':logsAll=null;renderMain();loadAllLogs();return;
    case 'logmore':logShow+=200;renderMain();return;
    case 'role':{
      var s3=staffById[d.id],mk=d.v==='1';
      if(!s3||!confirm(s3.name+(mk?' yönetici yapılsın mı? Kendi PIN\'iyle girince yönetici paneli açılır.':' için yöneticilik kaldırılsın mı?')))break;
      r=await rpc('admin_set_role',{p_pin:admin.pin,p_staff:+d.id,p_admin:mk});
      if(r&&r.ok){await loadStatus();toast(mk?'Yönetici yapıldı':'Yöneticilik kaldırıldı')}
      break}
    case 'deact':{
      var s2=staffById[d.id];if(!s2||!confirm(s2.name+' listeden çıkarılsın mı? Geçmiş kayıtları saklanır.'))break;
      var ep=prompt('Onay için yönetici şifrenizi girin'+(admin.viaStaff?' (kendi PIN\'iniz)':''));if(ep===null||!ep.trim())break;
      r=await rpc('admin_set_active',{p_pin:admin.viaStaff?me.id+':'+ep.trim():ep.trim(),p_staff:+d.id,p_active:false});
      if(r&&r.ok){await loadStaff();await loadStatus(true);renderAll()}
      break}
    case 'adm-pinchg':{
      var op=prompt('Eski yönetici PIN');if(op===null)break;var np=prompt('Yeni yönetici PIN (4-12 rakam)');if(np===null)break;
      r=await rpc('admin_change_pin',{p_old:op.trim(),p_new:np.trim()});
      if(r&&r.ok){admin.pin=np.trim();saveAdm();toast('Yönetici PIN değiştirildi')}
      break}
    case 'export-pdf':await exportPdf();break;
    case 'export-csv':await exportData('csv');break;
    case 'export-json':await exportData('json');break;
  }
  scheduleRender();
  if(el&&el.tagName==='BUTTON'&&el.isConnected)el.disabled=false;
}
async function run(a,d,el){try{await act(a,d,el)}catch(e){toast('Hata: '+(e.message||e),1);if(el&&el.disabled)el.disabled=false}}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(!b||/^(SELECT|INPUT|OPTION|TEXTAREA)$/.test(e.target.tagName)||b.tagName==='SELECT')return;
  e.preventDefault();run(b.dataset.a,b.dataset,b)});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='who'){var pp=$('pin');if(pp){pp.value='';pp.focus()}fetchPinLen();return}

  var s=e.target;if(s.tagName==='SELECT'&&s.dataset.a){var d=Object.assign({},s.dataset,{value:s.value});s.blur();run(s.dataset.a,d,s)}});
document.addEventListener('click',function(e){if(e.target&&e.target.closest&&e.target.closest('#snd')){toggleSound();return}var v=$('gv');if(v&&v.paused)playGv()});
document.addEventListener('touchstart',function(){var v=$('gv');if(v&&v.paused)playGv()},{passive:true});
document.addEventListener('visibilitychange',function(){if(!document.hidden)playGv()});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='pin'){autoLogin();return}
  if(e.target&&e.target.id==='logq'){logQ=e.target.value;logShow=200;renderMain();var q=$('logq');if(q){q.focus();var n=q.value.length;try{q.setSelectionRange(n,n)}catch(x){}}}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(e.target.id==='pin'){e.preventDefault();run('login',{},null)}
  else if(e.target.id==='apin'){e.preventDefault();run('adm-in',{},null)}
  else if(e.target.id==='np1'||e.target.id==='np2'){e.preventDefault();run('setpin',{},null)}});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;renderInstall()});

/* ---------- başlangıç ---------- */
async function init(){
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
  if(!window.supabase){setErr('Supabase kütüphanesi yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.');return}
  sb=window.supabase.createClient(CFG.URL,CFG.KEY,{realtime:{params:{eventsPerSecond:10}}});
  var sm=null,sa=null;
  try{localStorage.removeItem('izin_me')}catch(e){}
  try{sm=JSON.parse(sessionStorage.getItem('izin_me')||'null')}catch(e){}
  try{sa=sessionStorage.getItem('izin_adm')}catch(e){}
  if(!sm&&!sa&&pkHas()&&!pkAuto){pkAuto=true;pkBusy=true;pkLogin(true).finally(function(){pkBusy=false})}
  await loadAll();
  if(sm&&sm.id&&sm.pin){var r=await rpc('staff_login',{p_staff:sm.id,p_pin:sm.pin},true);
    if(r&&r.ok){me={id:sm.id,pin:sm.pin,name:r.name,mustChange:!!r.must_change};if(r.admin)admin={pin:sm.id+':'+sm.pin,viaStaff:true}}
    else if(r){me=null;saveMe()}}
  if(sa&&!admin){var r2=await rpc('admin_login',{p_pin:sa},true);if(r2&&r2.ok)admin={pin:sa};else if(r2){admin=null;saveAdm()}}
  renderAll();
  if(admin)loadStatus();
  subscribe();poll();
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')loadAll()});
}
window.__izin={pdfHtml:pdfHtml,compute:compute,setWeek:function(n){week=n},setSel:function(i){selDay=i},render:renderAll};
init();
})();
</script>
